<text x="48" y="436" font-family="Arial" font-size="11" fill="#000000">Uma fabrica concreta por familia. O Client recebe a fabrica,</text>
<text x="48" y="449" font-family="Arial" font-size="11" fill="#000000">chama criarProdutoA e criarProdutoB e nunca escreve o nome</text>
<text x="48" y="462" font-family="Arial" font-size="11" fill="#000000">de uma classe concreta: por isso nao ha como combinar</text>
<text x="48" y="475" font-family="Arial" font-size="11" fill="#000000">ProductA1 com ProductB2. A coerencia entre os produtos nao</text>
<text x="48" y="488" font-family="Arial" font-size="11" fill="#000000">e validada em tempo de execucao - ela e inalcancavel.</text>
