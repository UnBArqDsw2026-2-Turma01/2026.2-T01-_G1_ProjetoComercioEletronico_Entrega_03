<text x="908" y="256" font-family="Arial" font-size="11" fill="#000000">Cada fabrica cria o trio inteiro da sua familia:</text>
<text x="908" y="269" font-family="Arial" font-size="11" fill="#000000">autorizador, comprovante e politica de estorno.</text>
<text x="908" y="282" font-family="Arial" font-size="11" fill="#000000">A relacao «cria» esta desenhada no diagrama</text>
<text x="908" y="295" font-family="Arial" font-size="11" fill="#000000">generico; aqui ela foi omitida porque as quatro</text>
<text x="908" y="308" font-family="Arial" font-size="11" fill="#000000">fabricas criam doze produtos, e as setas</text>
<text x="908" y="321" font-family="Arial" font-size="11" fill="#000000">cobririam o desenho.</text>
<text x="908" y="334" font-family="Arial" font-size="11" fill="#000000">O ServicoDeCheckout cria os tres de uma unica</text>
<text x="908" y="347" font-family="Arial" font-size="11" fill="#000000">fabrica, no construtor, e nao ha caminho no</text>
<text x="908" y="360" font-family="Arial" font-size="11" fill="#000000">codigo para obter um produto isolado.</text>
